/** Wat wordt er op dit moment van jou verwacht? */
function watMoetIkNog(){
  var nu=huidigeRonde(), lijst=[];
  ['hk','pk'].forEach(function(ck){
    var c=S.comps[ck], m=c.matches[nu];
    if(rondeDicht(ck,nu))return;
    if(!(m.home&&m.away)){
      if(beurtVoor(nu)===ME||ADMIN)
        lijst.push({tab:'wvdw',tekst:'Kies de wedstrijd voor de '+c.name,comp:ck});
      return;
    }
    var pr=c.preds[ME];
    if(pr&&!String(pr.wvdw[nu]||'').trim())
      lijst.push({tab:'wvdw',tekst:'Voorspel '+matchLabel(m),comp:ck});
  });
  ['hk','pk'].forEach(function(ck){
    if(S.comps[ck].dicht)return;
    var pr=S.comps[ck].preds[ME];
    if(pr&&pr.standing.filter(Boolean).length<12)
      lijst.push({tab:'pred',tekst:'Je '+S.comps[ck].name+'-eindstand is nog niet compleet',comp:ck});
  });
  // Lukt het automatisch ophalen niet, dan moet de beheerder dat weten, niet pas weken later.
  if(ADMIN&&S.autoAan&&S.autoFout)
    lijst.push({tab:'live',tekst:'Automatisch ophalen lukt niet. Tik voor de details',let:1});
  // Een gespeelde ronde zonder uitslag betekent dat de stand niet klopt.
  ['hk','pk'].forEach(function(ck){
    var c=S.comps[ck];
    (c.mist||[]).forEach(function(i){
      lijst.push({tab:'live',comp:ck,tekst:'Uitslag ontbreekt: '+c.name+' ronde '+(i+1)+', '+matchLabel(c.matches[i])+
        (ADMIN?'. Druk bij Competitie op Nu ophalen':''),let:1});
    });
  });
  return lijst;
}

/** Wie heeft er voor de lopende ronde nog niets ingevuld? */
function wieMistNog(){
  var nu=huidigeRonde(), mist={};
  ['hk','pk'].forEach(function(ck){
    var c=S.comps[ck], m=c.matches[nu];
    if(rondeDicht(ck,nu)||!(m.home&&m.away))return;
    S.players.forEach(function(p){
      var pr=c.preds[p];
      if(pr&&!String(pr.wvdw[nu]||'').trim())mist[p]=1;
    });
  });
  return Object.keys(mist);
}

/** Eén regel per competitie: speeldatum, sluitmoment en aftelling. */
/** "zo 18/10 15:00": kort genoeg voor één regel op een telefoon. */
function kortDatum(v){
  if(!v)return '';
  var d=(v instanceof Date)?v:new Date(v), dagen=['zo','ma','di','wo','do','vr','za'];
  return dagen[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
}
function klokRegels(nu){
  return '<div class="klokken">'+['hk','pk'].map(function(ck){
    var c=S.comps[ck], d=speeldatum(ck,nu), dl=deadlineVoor(ck,nu);
    var rest=resterend(dl), dicht=rondeDicht(ck,nu), af=wijktAf(ck,nu);
    var uitslag=String(c.matches[nu].actual||'').trim();
    var status = dicht
      ? (uitslag?'<span class="tag ok">'+h(uitslag)+'</span>'
          :(d&&d.getTime()<Date.now()?'<span class="tag">uitslag volgt</span>':'<span class="tag">gesloten</span>'))
      : (rest ? '<span class="klok'+(new Date(dl).getTime()-Date.now()<86400000?' bijna':'')+'">nog '+aftelKort(dl)+'</span>'
              : '<span class="klok">geen datum</span>');
    return '<div class="klokrij'+(af?' afwijkend':'')+'">'+
      '<span class="kcomp">'+h(c.name)+'</span><span class="kstatus">'+status+'</span>'+
      '<span class="kdatum">'+(d?(d.getTime()<Date.now()?'speelde ':'speelt ')+h(kortDatum(d)):'–')+'</span>'+
      (dl&&!dicht?'<span class="ksluit">sluit '+h(kortDatum(dl))+'</span>':'')+
      (af?'<span class="kwaarschuw">speelt doordeweeks, controleer het sluitmoment</span>':'')+
      '</div>';
  }).join('')+'</div>';
}

function beurtBanner(){
  var nu=huidigeRonde(), wie=beurtVoor(nu), ik=(wie===ME);
  var todo=watMoetIkNog(), mist=wieMistNog();
  // Het eerstvolgende sluitmoment van deze ronde, groot in beeld.
  var eerst='';
  ['hk','pk'].forEach(function(ck){
    if(rondeDicht(ck,nu))return;
    var dl=deadlineVoor(ck,nu);
    if(dl&&(!eerst||new Date(dl)<new Date(eerst)))eerst=dl;
  });
  // Minder dan een dag en nog iets te doen: dan mag het spannend worden.
  var krap=eerst&&todo.some(function(t){return t.tab==='wvdw';})&&new Date(eerst).getTime()-Date.now()<86400000;
  var aftel=eerst&&aftelKort(eerst)
    ? '<div class="aftel'+(krap?' krap':'')+'"><b>'+aftelKort(eerst)+'</b><span>'+(krap?'laatste kans, de ronde sluit bijna':'tot de ronde sluit')+'</span></div>'
    : '<div class="aftel"><span>Deze ronde is gesloten.</span></div>';
  var takenHtml = todo.length
    ? '<div class="taken">'+todo.map(function(t){
        return '<button class="taak'+(t.let?' let':'')+'" data-ga="'+t.tab+'"'+(t.comp?' data-comp="'+t.comp+'"':'')+'>'+h(t.tekst)+'</button>';
      }).join('')+'</div>'
    : '<div class="taken klaar">'+IK.vink+'<span>Je bent bij, niets meer te doen deze ronde.</span></div>';
  var mistHtml = mist.length
    ? '<div class="mist">Nog niet ingevuld:'+mist.map(function(p){
        return '<span class="wie">'+avatar(p,'s')+(p===ME?'jij':h(p))+'</span>';
      }).join('')+'</div>'
    : '';
  var volgende=[1,2,3].map(function(k){
    return '<span>W'+(nu+1+k)+' · <b>'+h(beurtVoor(nu+k))+'</b></span>';
  }).join('');
  return '<div class="hero veld'+(todo.length?' actie':'')+'">'+
    '<div class="hallo">'+begroeting()+', '+h(ME)+mijnPlek()+'</div>'+
    '<div class="herokop"><span class="ronde">Speelronde '+(nu+1)+'</span>'+
      '<span class="tag'+(ik?' me':'')+'">'+(ik?'jouw keuze':h(wie)+' kiest')+'</span></div>'+
    aftel+takenHtml+mistHtml+klokRegels(nu)+
    '<div class="hierna">Hierna '+volgende+'</div></div>';
}

/** Eerstvolgende ronde vanaf nu waarin ik kies. */

/* ================= eindstand-voorspellingen ================= */
function teamOpts(teams,sel){
  return '<option value=""></option>'+teams.map(function(t){return '<option'+(eq(t,sel)?' selected':'')+'>'+h(t)+'</option>';}).join('');
}
function predKaart(ck,p){
  var c=S.comps[ck], pr=c.preds[p]||blankPred();
  var eindstandBekend=!!String(c.result.standing[0]||'').trim();
  var zichtbaar=(p===ME||c.dicht||eindstandBekend);
  var mag=canEditPred(ck,p,'standing',0);
  var s=scorePlayer(c,p,S.pts);

  // dubbele teams opsporen
  var seen={},dup={},dubbelNamen={};
  pr.standing.forEach(function(t,i){
    if(!t)return;
    if(seen[t]!==undefined){dup[i]=1;dup[seen[t]]=1;dubbelNamen[t]=1;}else seen[t]=i;
  });
  var dubbel=Object.keys(dubbelNamen);

  var kop='<div class="predkop">'+avatar(p)+'<span class="naam">'+h(p)+bekerHtml(p)+'</span>'+
    (p===ME?'<span class="tag me">jij</span>':'')+
    '<div class="spacer"></div>'+
    '<span class="mini">punten</span><span class="predpunten">'+(s.positie+s.bonus)+'</span></div>';

  if(!zichtbaar&&!mag){
    return '<div class="predkaart">'+kop+
      '<div class="verborgen">Verborgen tot de competitie begint.</div></div>';
  }

  // Zolang de eindstand er niet is: laat zien wat er nú goed staat volgens de competitiestand.
  var L=(c.live&&c.live.standing)||[];
  var rijen=pr.standing.map(function(t,i){
    var goed=eq(t,c.result.standing[i]), nuGoed=!eindstandBekend&&!!t&&eq(t,L[i]);
    var cel=mag
      ? '<select data-a="standing" data-c="'+ck+'" data-p="'+h(p)+'" data-i="'+i+'" aria-label="Plek '+(i+1)+'">'+teamOpts(c.teams,t)+'</select>'
      : '<span class="ro'+(goed?' goed':'')+(nuGoed?' nu':'')+'">'+teamLogo(t)+(h(t)||'–')+(nuGoed?'<i class="nugoed">staat nu goed</i>':'')+'</span>';
    return '<div class="predrij'+(i===0?' top':'')+(dup[i]?' fout':'')+'"><span class="nr">'+(i+1)+'</span>'+cel+'</div>';
  }).join('');

  function bonusRij(label,veld,isTeam){
    var v=pr[veld], goed=eq(v,c.result[veld]);
    var cel=mag
      ? (isTeam
          ? '<select data-a="'+veld+'" data-c="'+ck+'" data-p="'+h(p)+'">'+teamOpts(c.teams,v)+'</select>'
          : '<input value="'+h(v)+'" data-a="'+veld+'" data-c="'+ck+'" data-p="'+h(p)+'" placeholder="naam van de speler">')
      : '<span class="ro'+(goed?' goed':'')+'">'+(h(v)||'–')+'</span>';
    return '<div class="predrij"><span class="nr">'+label+'</span>'+cel+'</div>';
  }

  var bonus='<div class="predbonus">'+
    bonusRij(ck==='hk'?'Kampioen (play-offs)':'Kampioen','kampioen',true)+
    bonusRij('Winterkampioen','winter',true)+
    bonusRij('Topscorer','topscorer',false)+
    bonusRij('Minste tegengoals','minsteTegen',true)+
    bonusRij('Meest scorend','meestScorend',true)+
    (ck==='hk'?bonusRij('Speler van het seizoen','speler',false):'')+
    '</div>';

  var waarschuwing=dubbel.length
    ? '<p class="warn" style="margin:0 0 10px">'+h(dubbel.join(', '))+
      (dubbel.length>1?' staan':' staat')+' meer dan één keer in je lijst.</p>'
    : '';

  var nuGoedTotaal=0;
  if(!eindstandBekend)pr.standing.forEach(function(t,i){if(t&&eq(t,L[i]))nuGoedTotaal++;});
  var samen=(!mag&&!eindstandBekend&&L.some(Boolean))
    ? '<div class="nusamen"><b>'+nuGoedTotaal+' van 12</b> staan nu goed · '+(nuGoedTotaal*S.pts.positie)+' punten als het zo blijft</div>'
    : '';
  return '<div class="predkaart'+(p===ME?' mijn':'')+(mag?'':' lees')+'">'+kop+samen+waarschuwing+rijen+bonus+'</div>';
}

function predBlock(ck){

  var anderen=S.players.filter(function(p){return p!==ME;});
  var mijnKaart=(S.players.indexOf(ME)>=0)?predKaart(ck,ME):'';
  var andereKaarten=anderen.map(function(p){

}

/* ================= competitiestand ================= */
/** "18 pt · 22-8 · " voor een team, als de cijfers bekend zijn. */
function cijferTekst(c,team){
  var cf=((c.live&&c.live.cijfers)||[]).filter(function(x){return x.team===team;})[0];
  return cf?'<span class="cijfers">'+(cf.punten!=null?cf.punten+' pt · ':'')+cf.voor+'-'+cf.tegen+'</span> · ':'';
}
function liveBlock(ck){
  var c=S.comps[ck], L=c.live||{standing:[],updated:''};
  var ingevuld=L.standing.filter(function(t){return !!t;}).length;
  var seen={},dup={};
  L.standing.forEach(function(t,i){if(!t)return;if(seen[t]!==undefined){dup[i]=1;dup[seen[t]]=1;}else seen[t]=i;});

  var cfs=(L.cijfers||[]), heeftCijfers=cfs.length>0;
  function cijfer(t){return cfs.filter(function(x){return x.team===t;})[0];}
  var rijen=L.standing.map(function(t,i){
    var wie=S.players.filter(function(p){var pr=c.preds[p]; return pr&&eq(pr.standing[i],t);});
    var cf=t&&cijfer(t), ds=cf?cf.voor-cf.tegen:null;
    var zone=(ck==='hk'&&i<4)||(ck!=='hk'&&i===0)?' zone':'';
    return '<li class="strij'+(wie.indexOf(ME)>=0?' me':'')+zone+(i===3&&ck==='hk'?' grens':'')+'">'+
      '<span class="nr">'+(i+1)+'</span>'+
      '<span class="tm">'+teamLogo(t)+'<span class="tn">'+(h(t)||'–')+'</span></span>'+
      (heeftCijfers?'<span class="gs">'+(cf?cf.gespeeld:'')+'</span><span class="ds">'+(cf?(ds>0?'+':'')+ds:'')+'</span>'+
        '<span class="pt">'+(cf&&cf.punten!=null?cf.punten:'')+'</span>':'')+
      '<span class="raak">'+(wie.length?wie.map(function(p){return avatar(p,'xs');}).join(''):'')+'</span>'+
      '</li>';
  }).join('');
  var kop='<li class="strij kop" aria-hidden="true"><span class="nr">#</span><span class="tm">Team</span>'+
    (heeftCijfers?'<span class="gs">GS</span><span class="ds">DS</span><span class="pt">PT</span>':'')+'<span class="raak">goed</span></li>';
  var legenda='<p class="hint stlegenda"><span class="zonebol"></span>'+(ck==='hk'?'play-offs':'kampioen')+
    ' · <span class="av av-xs" style="--k:var(--dim)">?</span> wie dit team op deze plek had</p>';
  var aanpassen=ADMIN?'<details class="wbeheer"><summary>Per plek aanpassen</summary><div class="livelijst">'+
    L.standing.map(function(t,i){
      return '<div class="liverij"><span class="nr">'+(i+1)+'</span><select data-a="lstanding" data-c="'+ck+'" data-i="'+i+'" class="'+(dup[i]?'dup':'')+'" aria-label="Plek '+(i+1)+'">'+teamOpts(c.teams,t)+'</select></div>';
    }).join('')+'</div></details>':'';

/** Aanval tegen verdediging: elk team als punt, uit de doelpunten van de competitiestand. */
function aanvalBlok(ck){
  var cf=((S.comps[ck].live&&S.comps[ck].live.cijfers)||[]).filter(function(c){return c.gespeeld>0;});
  if(cf.length<4)return '<p class="hint">Zodra de doelpunten van deze competitie binnen zijn, staat hier hoe elk team aanvalt en verdedigt.</p>';
  var pv=cf.map(function(c){return {t:c.team,v:c.voor/c.gespeeld,g:c.tegen/c.gespeeld};});
  var W=320,H=240,L=30,R=14,T=14,B=36;
  // As strak om de data, met een halve goal marge, zodat de teams uit elkaar komen te staan.
  function bereik(k){var w=pv.map(function(p){return p[k];});return [Math.max(0,Math.floor((Math.min.apply(null,w)-.4)*2)/2),Math.ceil((Math.max.apply(null,w)+.4)*2)/2];}
  var rv=bereik('v'), rg=bereik('g');
  // Minder tegen = beter, dus de verdediging loopt van links (lek) naar rechts (dicht).
  var x=function(g){return L+(W-L-R)*(rg[1]-g)/(rg[1]-rg[0]);}, y=function(v){return T+(H-T-B)*(rv[1]-v)/(rv[1]-rv[0]);};
  var gemV=pv.reduce(function(n,p){return n+p.v;},0)/pv.length, gemG=pv.reduce(function(n,p){return n+p.g;},0)/pv.length;
  function tikken(r){var uit=[],st=(r[1]-r[0])>2.5?1:.5;for(var t=Math.ceil(r[0]/st)*st;t<=r[1]+1e-9;t+=st)uit.push(Math.round(t*10)/10);return uit;}
  var komma=function(n){return String(n).replace('.',',');};
  var raster=tikken(rv).map(function(v){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end">'+komma(v)+'</text>';}).join('')+
    tikken(rg).map(function(g){return '<text x="'+x(g).toFixed(1)+'" y="'+(H-B+15)+'" text-anchor="middle">'+komma(g)+'</text>';}).join('');
  var gem='<line class="gem" x1="'+x(gemG).toFixed(1)+'" x2="'+x(gemG).toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'"/>'+
    '<line class="gem" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(gemV).toFixed(1)+'" y2="'+y(gemV).toFixed(1)+'"/>';
  var hoek='<text class="hk" x="'+(W-R-4)+'" y="'+(T+11)+'" text-anchor="end">sterk</text>'+
    '<text class="hk" x="'+(L+4)+'" y="'+(H-B-6)+'">zwak</text>';
  // Korte code per team: HDM en SCHC blijven, Oranje-Rood wordt OR, Amsterdam AMS.
  function code(t){t=String(t);if(t.length<=4)return t.toUpperCase();var w=t.split(/[\s-]+/).filter(Boolean);
    return (w.length>1?w.map(function(x){return x.charAt(0);}).join(''):t.slice(0,3)).toUpperCase();}
  var bezet=[], punten=pv.slice().sort(function(a,b){return (b.v-b.g)-(a.v-a.g);}).map(function(p){
    var cx=x(p.g), cy=y(p.v), c=code(p.t), bw=c.length*7.2+3, bh=13, plek=null;
    bezet.push({x:cx-5,y:cy-5,w:10,h:10});
    [[7,-6.5],[-7-bw,-6.5],[-bw/2,-19],[-bw/2,6]].some(function(o){
      var r={x:cx+o[0],y:cy+o[1],w:bw,h:bh};
      if(r.x<L||r.x+r.w>W-R+10||r.y<T-4||r.y+r.h>H-B)return false;
      var vrij=!bezet.some(function(q){return r.x<q.x+q.w&&q.x<r.x+r.w&&r.y<q.y+q.h&&q.y<r.y+r.h;});
      if(vrij)plek=r; return vrij;
    });
    if(plek)bezet.push(plek);
    return '<g class="tp"><circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5"><title>'+h(p.t)+': '+
      komma(p.v.toFixed(1))+' voor, '+komma(p.g.toFixed(1))+' tegen per wedstrijd</title></circle>'+
      (plek?'<text x="'+(plek.x+1).toFixed(1)+'" y="'+(plek.y+9).toFixed(1)+'">'+h(c)+'</text>':'')+'</g>';
  }).join('');
  var lijst=pv.slice().sort(function(a,b){return (b.v-b.g)-(a.v-a.g);}).map(function(p){
    return '<li><span>'+teamLogo(p.t)+h(p.t)+' <small>'+h(code(p.t))+'</small></span><b>'+komma(p.v.toFixed(1))+'</b><b>'+komma(p.g.toFixed(1))+'</b></li>';
  }).join('');
  return '<svg class="aanval" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Doelpunten voor en tegen per wedstrijd, per team">'+
    '<g class="ras">'+raster+'</g>'+gem+hoek+punten+
    '<text class="as" x="'+((L+W-R)/2)+'" y="'+(H-4)+'" text-anchor="middle">tegen per wedstrijd · minder is beter →</text>'+
    '<text class="as" transform="translate(10 '+((T+H-B)/2)+') rotate(-90)" text-anchor="middle">voor per wedstrijd</text></svg>'+
    '<ol class="aanlijst"><li class="kop"><span>Team</span><b>Voor</b><b>Tegen</b></li>'+lijst+'</ol>'+
    '<p class="hint">Gemiddeld per wedstrijd, uit de competitiestand. De stippellijnen zijn het gemiddelde van de competitie. Handig voor de bonusvragen minste tegengoals en meest scorend.</p>';
}

    : '';
  return paginaKop('Competitie','naast ieders voorspelling')+fout+uitleg+liveBlock(compKeuze)+

      : '<span class="ro">'+(h(t)||'–')+'</span>')+'</div>';

/* Na een nieuwe speeldag het openingsscherm: uitslagen, winnaar, nieuwe stand, volgende ronde. */
function recapSleutel(){return 'hn-recap-'+ME;}
function recapNieuw(){
  if(!S||S.players.indexOf(ME)<0)return false;
  var lr=laatsteRonde(scoreAll()); if(!lr||!lr.mee.length)return false;
  var gezien=''; try{gezien=localStorage.getItem(recapSleutel())||'';}catch(e){}
  return gezien!==lr.sleutel;
}
var recapStap=0;
function toonRecap(){
  var sc=scoreAll(), lr=laatsteRonde(sc); if(!lr)return;
  try{localStorage.setItem(recapSleutel(),lr.sleutel);}catch(e){}
  var order=S.players.slice().sort(function(a,b){return sc[b].total-sc[a].total;}), plek={};
  order.forEach(function(p,i){plek[p]=(i>0&&sc[p].total===sc[order[i-1]].total)?plek[order[i-1]]:i+1;});
  var ik=S.players.indexOf(ME)>=0, slides=[];
  // 1. de uitslagen
  var mijnTot=ik?lr.punten[ME]:0;
  slides.push('<div class="rs-kop"><small>Speeldag'+(lr.naam?' · '+h(lr.naam):'')+'</small><h2>De uitslagen</h2></div>'+
    '<div class="rs-duels">'+lr.mee.map(function(g){
      var c=S.comps[g.ck], m=c.matches[g.i], u=parseScore(m.actual)||['?','?'];
      var mv=ik?(c.preds[ME]||blankPred()).wvdw[g.i]:'', pt=ik?matchPoints(mv,m.actual,S.pts):0;
      return '<div class="rs-duel"><div class="rs-comp">'+h(c.name)+'</div>'+
        '<div class="rs-teams"><div>'+(m.home?clubBadge(m.home):'')+'<b>'+h(m.home||'thuis')+'</b></div>'+
        '<div class="rs-uitslag">'+u[0]+'<i>–</i>'+u[1]+'</div>'+
        '<div>'+(m.away?clubBadge(m.away):'')+'<b>'+h(m.away||'uit')+'</b></div></div>'+
        (ik?'<div class="rs-jij">jij: '+(mv?h(mv):'niets ingevuld')+(pt?' <span class="rchip plus">+'+pt+'</span>':'')+(pt===S.pts.exact?' <span class="exact">Exact</span>':'')+'</div>':'')+
        '</div>';
    }).join('')+'</div>'+
    (ik?'<div class="rs-groot"><small>Jij scoorde</small><b>'+(mijnTot>0?'+'+mijnTot:'0')+'</b><span>punten</span></div>':''));
  // 2. de winnaar
  var w=lr.winnaars, ex=S.players.filter(function(p){return lr.exact[p];});
  slides.push('<div class="rs-kop"><small>Speeldag'+(lr.naam?' · '+h(lr.naam):'')+'</small><h2>'+(w.length>1?'De winnaars':(w.length?'De winnaar':'Geen winnaar'))+'</h2></div>'+
    (w.length?'<div class="rs-winnaars'+(w.length>2?' veel':'')+'">'+w.map(function(p){
      return '<div>'+avatar(p,'xxl')+'<b>'+(p===ME?'Jij':h(p))+'</b></div>';
    }).join('')+'</div><div class="rs-groot"><b>+'+lr.best+'</b><span>punten</span></div>'
      :'<p class="rs-tekst">Niemand scoorde punten deze speeldag.</p>')+
    (ex.length?'<p class="rs-tekst">Exact goed: <b>'+opsomming(ex.map(function(p){return p===ME?'jij':h(p);}))+'</b></p>':''));
  // 3. de stand
  slides.push('<div class="rs-kop"><small>Na deze speeldag</small><h2>De stand</h2></div>'+
    '<div class="rs-stand">'+order.map(function(p){
      var d=lr.punten[p]||0;
      return '<div class="rs-rij'+(p===ME?' ik':'')+'"><span class="rs-nr">'+plek[p]+'</span>'+avatar(p)+
        '<span class="rs-nm">'+(p===ME?'Jij':h(p))+beweging(lr,p,plek[p])+'</span>'+
        '<span class="rs-d">'+(d?'+'+d:'')+'</span><b>'+sc[p].total+'</b></div>';
    }).join('')+'</div>');

    if(!m.home&&!m.away)return '<div class="rs-volg"><small>'+h(S.comps[ck].name)+'</small><b>nog te kiezen door '+(kiezer===ME?'jou':h(kiezer))+'</b></div>';

    '<div class="rs-knoppen">'+(komend?'<button class="btn pri" data-rs="wvdw">Voorspel nu</button>':'')+

  var el=document.getElementById('recap');

  el.innerHTML='<div class="rs-balk">'+slides.map(function(){return '<i></i>';}).join('')+'</div>'+
    '<button class="ikoon rs-sluit" data-rs="klaar" aria-label="Overslaan"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>'+
    slides.map(function(x,i){return '<section class="rs-slide" data-i="'+i+'">'+x+'</section>';}).join('')+
    '<div class="rs-hint">Tik rechts voor verder, links voor terug</div>';
  document.body.classList.add('profielopen');
  recapStap=0; recapNaar(0);
  el.onclick=function(e){
    var k=e.target.closest('[data-rs]');
    if(k){
      if(k.dataset.rs==='wvdw'){sluitRecap();tab='wvdw';render();window.scrollTo(0,0);return;}
      return sluitRecap();
    }
    if(e.target.closest('button,a,input'))return;
    var links=e.clientX<window.innerWidth*0.33;
    if(links)recapNaar(recapStap-1);
    else if(recapStap<slides.length-1)recapNaar(recapStap+1);
  };
}
function recapNaar(i){
  var el=document.getElementById('recap'); if(!el)return;
  var n=el.querySelectorAll('.rs-slide').length; i=Math.max(0,Math.min(n-1,i)); recapStap=i;
  [].forEach.call(el.querySelectorAll('.rs-slide'),function(sl,j){sl.classList.toggle('aan',j===i);});
  [].forEach.call(el.querySelectorAll('.rs-balk i'),function(b,j){b.className=j<i?'vol':(j===i?'nu':'');});
  el.querySelector('.rs-hint').style.visibility=i===n-1?'hidden':'';
}
function sluitRecap(){
  var el=document.getElementById('recap'); if(el)el.remove();
  if(!profielVan)document.body.classList.remove('profielopen');
}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('recap'))return;
  if(e.key==='Escape')sluitRecap();
  if(e.key==='ArrowRight')recapNaar(recapStap+1);
  if(e.key==='ArrowLeft')recapNaar(recapStap-1);
});

function onInput(e){
  var el=e.target.closest('[data-a]'); if(!el||el.tagName==='SELECT')return;
  var a=el.dataset.a, ck=el.dataset.c, p=el.dataset.p, i=Number(el.dataset.i), v=el.value;
  if(el.dataset.half){
    v=scoreUit(el); scoreDoor(el);
    // null betekent: pas één van de twee cijfers ingevuld, nog even wachten.
    if(v===null)return;
  }
  if(a==='mlabel'){patch(['comps',ck,'matches',i,'label'],v);return;}
  if(a==='mactual'){patch(['comps',ck,'matches',i,'actual'],v);return;}
  if(a==='pred'){
    patch(['comps',ck,'preds',p,'wvdw',i],v);
    var vak=el.closest('.sc');
    var box=(vak||el).nextElementSibling, act=S.comps[ck].matches[i].actual, pt=matchPoints(v,act,S.pts);
    if(box){box.className='pts '+(pt>=10?'p10':pt>=7?'p7':pt>=5?'p5':pt>=2?'p2':'p0');
      box.innerHTML=(act&&parseScore(act))?pt:'&nbsp;';}
    return;
  }
  if(a==='topscorer'){patch(['comps',ck,'preds',p,'topscorer'],v);return;}
  if(a==='rtopscorer'){patch(['comps',ck,'result','topscorer'],v);return;}
}
function onChange(e){
  if(e.target.id==='fotoKies'){kiesFoto(e.target.files&&e.target.files[0]);e.target.value='';return;}
  var el=e.target.closest('[data-a]'); if(!el)return;
  var a=el.dataset.a, ck=el.dataset.c, p=el.dataset.p, i=Number(el.dataset.i), v=el.value;
  if(a==='zoekmatch'){
    if(!String(v).trim())return;
    var pp=splitsMatch(ck,v);
    if(!pp){el.classList.add('dup');return toast('Kies een wedstrijd uit de lijst',true);}
    el.classList.remove('dup');
    patch(['comps',ck,'matches',i,'home'],pp[0]);
    patch(['comps',ck,'matches',i,'away'],pp[1]);
    render();toast(pp[0]+' - '+pp[1]);
    return;
  }
  if(a==='lstanding'){patch(['comps',ck,'live','standing',i],v);render();return;}
  if(a==='standing'){patch(['comps',ck,'preds',p,'standing',i],v);render();return;}
  if(a==='kampioen'||a==='winter'||a==='minsteTegen'||a==='meestScorend'||a==='speler'){patch(['comps',ck,'preds',p,a],v);render();return;}
  if(a==='rspeler'){patch(['comps',ck,'result','speler'],v);render();return;}
  if(a==='rkampioen'){patch(['comps',ck,'result','kampioen'],v);render();return;}
  if(a==='rstanding'){patch(['comps',ck,'result','standing',i],v);render();return;}
  if(a==='rwinter'){patch(['comps',ck,'result','winter'],v);render();return;}
  if(a==='rminsteTegen'){patch(['comps',ck,'result','minsteTegen'],v);render();return;}
  if(a==='rmeestScorend'){patch(['comps',ck,'result','meestScorend'],v);render();return;}
  if(a==='mactual'){setTimeout(function(){if(!sending&&!aanHetTypen())render();},900);return;}
}
function onClick(e){
  // Op een speler tikken opent zijn profiel.
  var pf=e.target.closest('[data-profiel]');
  if(pf&&ME&&S&&S.players.indexOf(pf.dataset.profiel)>=0&&!e.target.closest('button,a,input,select,label')){
    e.preventDefault(); openProfiel(pf.dataset.profiel); return;
  }
  // competitie kiezen (ook vanuit een taak die naar één competitie wijst)
  var cp=e.target.closest('[data-comp]');
  if(cp){compKeuze=cp.dataset.comp;if(!cp.dataset.ga){render();return;}}
  if(e.target.closest('#btnLogout')){logout();return;}
  if(e.target.closest('[data-ververs]')){refresh(false);return;}
  if(e.target.closest('[data-fotoweg]')){zetFoto('');return;}
  if(e.target.closest('[data-recap]')){toonRecap();return;}
  // sprong vanuit de actiebalk
  var ga=e.target.closest('[data-ga]');
  if(ga){tab=ga.dataset.ga;render();window.scrollTo(0,0);return;}
  // speelronde bladeren op smal scherm
  var rk=e.target.closest('[data-ronde]');
  if(rk){
    naarRonde(rk.dataset.ronde==='nu'?huidigeRonde():Number(rk.dataset.ronde));
    return;
  }
  // wedstrijd kiezen openen of sluiten
  var kz=e.target.closest('[data-kies]');
  if(kz){
    var vak=document.getElementById('kiezer-'+kz.dataset.c);
    if(vak)vak.innerHTML = kz.dataset.kies==='dicht' ? '' : matchKiezer(kz.dataset.c,Number(kz.dataset.kies));
    return;
  }
  // een wedstrijd uit de lijst kiezen
  var zt=e.target.closest('[data-zet]');
  if(zt){
    var paar=splitsMatch(zt.dataset.c,zt.dataset.zet);
    if(!paar)return toast('Die wedstrijd herken ik niet',true);
    var ri=Number(zt.dataset.i);
    patch(['comps',zt.dataset.c,'matches',ri,'home'],paar[0]);
    patch(['comps',zt.dataset.c,'matches',ri,'away'],paar[1]);
    render();
    toast(paar[0]+' - '+paar[1]);
    return;
  }
  // puntenuitleg
  var u=e.target.closest('[data-uitleg]');
  if(u){
    var vak=document.getElementById('uitleg-'+u.dataset.c);
    if(vak){vak.innerHTML=puntenUitleg(u.dataset.c,u.dataset.p,Number(u.dataset.i));
      try{vak.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(x){}}
    return;
  }
  var b=e.target.closest('[data-adm]'); if(!b)return;
  var act=b.dataset.adm, arg=b.dataset.arg||null;
  if(act==='haalVoorstellen')return haalOp();
  if(act==='neemOver'){
    if(!VOORSTEL||VOORSTEL.bezig||!VOORSTEL.blokken)return;
    var blokken=VOORSTEL.blokken.map(function(b){return {comp:b.comp,uitslagen:[],ranglijst:[]};});
    [].slice.call(document.querySelectorAll('.vk-u:checked')).forEach(function(c){
      var b=Number(c.dataset.b), i=Number(c.dataset.i);
      var u=VOORSTEL.blokken[b]&&VOORSTEL.blokken[b].uitslagen[i];
      if(u)blokken[b].uitslagen.push(u);
    });
    [].slice.call(document.querySelectorAll('.vk-r:checked')).forEach(function(c){
      var b=Number(c.dataset.b);
      if(VOORSTEL.blokken[b]){blokken[b].ranglijst=VOORSTEL.blokken[b].ranglijst.slice();
        blokken[b].cijfers=(VOORSTEL.blokken[b].cijfers||[]).slice();}
    });
    var totaal=blokken.reduce(function(n,b){return n+b.uitslagen.length+b.ranglijst.length;},0);
    if(!totaal)return toast('Er staat niets aangevinkt',true);
    arg={blokken:blokken};
    VOORSTEL=null;
  }
  if(act==='setEmail'){
    var ev=document.getElementById('em-'+arg);
    arg={speler:arg,adres:ev?ev.value.trim():''};
  }
  if(act==='setAppUrl'){
    var au=document.getElementById('appurl');
    arg=au?au.value.trim():'';
  }
  if(act==='autoBijwerken'){
    if(!S.autoAan&&!confirm('De app mag dan zelf uitslagen en ranglijsten overnemen, zonder dat jij ze eerst ziet.\n\nElk uur kijkt hij of er een wedstrijd 2,5 uur geleden begon. Doorgaan?'))return;
    if(S.autoAan&&!confirm('Het zelf bijhouden uitzetten? Je vult daarna weer met de hand of met de knop hiernaast.'))return;
    arg=!S.autoAan;
  }
  if(act==='herinnering'){
    if(S.herinnerAan){
      if(!confirm('De herinnering uitzetten? Er gaan dan geen mailtjes meer uit.'))return;
    }else if(!confirm('De herinnering aanzetten? De app mag dan namens jou mailtjes sturen naar de poule.'))return;
    arg=!S.herinnerAan;
  }
  if(act==='addPlayer'){arg=document.getElementById('newp').value.trim(); if(!arg)return;}
  if(act==='removePlayer'&&!confirm('Speler '+arg+' verwijderen? Voorspellingen gaan mee weg.'))return;
  if(act==='resetPin'&&!confirm('Pincode van '+arg+' wissen? Hij kan dan een nieuwe kiezen.'))return;
  if(act==='setTeams'){
    var txt=document.getElementById('teams-'+arg).value;
    arg={comp:arg,teams:txt.split('\n').map(function(s){return s.trim();}).filter(Boolean)};
  }
  if(act==='setProgramma'){
    var pd=String(arg).split(':'), pv=document.getElementById('prog-'+pd[0]+'-'+pd[1]);
    if(!pv||!pv.value.trim())return toast('Plak eerst de wedstrijden',true);
    arg={comp:pd[0],ronde:Number(pd[1]),text:pv.value};
  }
  if(act==='wisProgramma'){
    var wd=String(arg).split(':');
    if(!confirm('Het programma van deze speelronde leegmaken?'))return;
    arg={comp:wd[0],ronde:Number(wd[1])};
  }
  if(act==='pasteLive'){
    var box=document.getElementById('paste-'+arg);
    if(!box||!box.value.trim())return toast('Plak eerst de ranglijst',true);
    arg={comp:arg,text:box.value};
  }
  if(act==='beurtOmhoog'||act==='beurtOmlaag'){
    var idx=Number(arg), naar=idx+(act==='beurtOmhoog'?-1:1);
    var lijst=S.beurten.slice();
    if(naar<0||naar>=lijst.length)return;
    var tmp=lijst[idx]; lijst[idx]=lijst[naar]; lijst[naar]=tmp;
    act='setBeurten'; arg=lijst;
  }
  if(act==='setDeadline'){
    var veld=document.getElementById('dl-'+arg);
    if(!veld||!veld.value)return toast('Kies eerst een datum en tijd',true);
    arg={ronde:huidigeRonde(),comp:arg,wanneer:new Date(veld.value).toISOString()};
  }
  if(act==='wisDeadline'){arg={ronde:huidigeRonde(),comp:arg};}
  if(act==='setBeker'){
    var sz=document.getElementById('bk-seizoen'), wn=document.getElementById('bk-winnaar');
    if(!sz||!sz.value.trim()||!wn||!wn.value)return toast('Vul seizoen en winnaar in',true);
    arg={seizoen:sz.value.trim(),winnaar:wn.value};
  }
  if(act==='verwijderBeker'&&!confirm('Bekertje van '+arg+' weghalen?'))return;
  if(act==='nieuwSeizoen'){
    var ns=document.getElementById('ns-naam'), nw=document.getElementById('ns-winnaar');
    if(!ns||!ns.value.trim())return toast('Geef het nieuwe seizoen een naam',true);
    if(!confirm('Nieuw seizoen starten?\n\nAlle voorspellingen, uitslagen en standen van '+S.season+
      ' worden gewist. Spelers, pincodes en bekertjes blijven staan. Dit kun je alleen ongedaan maken met de terugknop.'))return;
    arg={seizoen:ns.value.trim(),winnaar:nw?nw.value:''};
  }
  if(act==='herstelVorige'&&!confirm('Terug naar de vorige toestand? De laatste wijziging wordt teruggedraaid.'))return;
  if(act==='clearLive'&&!confirm('De actuele stand leegmaken?'))return;
  if(act==='liveNaarEindstand'&&!confirm('De huidige stand overnemen als definitieve eindstand? Hierna tellen alle ranglijst- en bonuspunten mee.'))return;
  setStatus('bezig…','busy'); b.disabled=true;
  google.script.run.withSuccessHandler(function(res){
    b.disabled=false;
    if(res&&res.error){setStatus('fout','err');toast(res.error,true);return;}
    S=res.state;setStatus('opgeslagen','ok');render();toast(res.melding||'Bijgewerkt');
  }).withFailureHandler(function(){b.disabled=false;setStatus('fout','err');toast('Mislukt',true);})
    .adminAction(ME,PIN,act,arg);
}
window.addEventListener('beforeunload',function(e){if(dirty||queue.length){e.preventDefault();e.returnValue='';}});
boot();
setTimeout(function(){document.documentElement.classList.add('klaar');},4000);
</script>

<script>
/*
 * Service worker + "nieuwe versie"-melding.
 * Een geïnstalleerde app blijft soms dagen open op de achtergrond. Daarom kijken
 * we bij terugkomen in de app (en elk half uur) of er een nieuwe versie is.
 * Neemt een nieuwe service worker het over, dan tonen we een balk.
 * Verversen wacht tot alles is opgeslagen.
 */
if ('serviceWorker' in navigator) {
  var hadSw = !!navigator.serviceWorker.controller; // eerste installatie is geen "update"
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      var kijk = function () { reg.update().catch(function () {}); };
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') kijk(); });
      setInterval(kijk, 30 * 60 * 1000);
    }).catch(function (e) { console.warn('service worker', e); });
  });
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadSw) { hadSw = true; return; }
    if (document.getElementById('hn-update')) return;
    var b = document.createElement('div');
    b.id = 'hn-update';
    b.innerHTML = '<span>Nieuwe versie klaar</span><button type="button">Verversen</button>';
    b.querySelector('button').onclick = function () {
      if (typeof queue !== 'undefined' && (queue.length || sending || dirty)) {
        if (typeof toast === 'function') toast('Even wachten, ik sla nog iets op', true);
        if (typeof flush === 'function') flush();
        return;
      }
      location.reload();
    };
    document.body.appendChild(b);
  });
}
// Bij uitloggen ook de offline-kopie van jouw gegevens van dit toestel halen.
(function () {
  var oud = logout;
  logout = function () {
    var klaar = function () { oud(); };
    if (window.caches) caches.delete('hn-api').then(klaar, klaar); else klaar();
  };
})();
</script>
